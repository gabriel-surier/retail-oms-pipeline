# PostgreSQL demo service
services:
  postgres:
    image: oms-postgres:1.0
    build:
      context: ./database
      dockerfile: Dockerfile
      args:
        ROP_POSTGRES_DB: ${ROP_POSTGRES_DB}
    container_name: demo_dev_database
    environment:
      POSTGRES_USER: ${ROP_POSTGRES_USER}
      POSTGRES_PASSWORD: ${ROP_POSTGRES_PASSWORD}
      POSTGRES_DB: ${ROP_POSTGRES_DB}
    ports:
      - "${ROP_POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata: